services:
  db:
    image: postgres:17
    container_name: hail-postgres
    environment:
      POSTGRES_USER: hail_user
      POSTGRES_PASSWORD: hail_password
      POSTGRES_DB: hail_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hail_user -d hail_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: hail-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hail_db
      SPRING_DATASOURCE_USERNAME: hail_user
      SPRING_DATASOURCE_PASSWORD: hail_password
    ports:
      - "8080:8080"